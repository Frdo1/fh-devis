<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mail</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E1116;color:#F2F4F7;font-family:Inter,system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  a{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:14px;background:#F5C518;color:#0E1116;font-weight:600;text-decoration:none}
  p{opacity:.7;word-break:break-all}
</style>
</head>
<body>
<div>
  <div style="font-size:40px">📧</div>
  <p id="to"></p>
  <a id="go" href="#">Écrire le mail</a>
</div>
<script>
  // Ouvre directement un nouveau mail (Gmail) avec l'adresse du client déjà remplie
  var q = new URLSearchParams(location.search);
  var to = q.get('to') || '', su = q.get('su') || '';
  var link = 'mailto:' + encodeURIComponent(to).replace(/%40/g, '@') + (su ? '?subject=' + encodeURIComponent(su) : '');
  document.getElementById('to').textContent = to;
  document.getElementById('go').href = link;
  location.href = link;
</script>
</body>
</html>
