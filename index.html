<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FH Devis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1116;--card:#171B22;--line:#262C36;--btn:#1F242D;--btnline:#2A313C;--txt:#F2F4F7;--sub:#C9CFD9;--mut:#9AA3B2;--acc:#F5C518;--red:#FF6B5F;--org:#FFA53D;--grn:#3DD68C;--blu:#4DA3FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.card,.stat,.tabs,header,.fab,.top,.lbl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
.h{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px}
header{padding:22px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--acc)}
h1{margin:4px 0 2px;font-size:32px}
.date{font-size:14px;color:var(--mut)}
.icon-btn{width:44px;height:44px;border-radius:14px;background:#1C2129;border:1px solid var(--btnline);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.stats{padding:18px 20px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left}
.stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:28px}
.stat span{font-size:12px;color:var(--mut)}
.tabs{margin:16px 20px 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.tabs button{min-width:0;height:58px;border:none;border-radius:12px;font-size:11px;font-weight:600;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px;white-space:nowrap}
.tabs button.on{background:#2A313C;color:var(--txt)}
.tabs .e{font-size:19px;line-height:1;position:relative}
.tabs i{position:absolute;top:-7px;right:-15px;font-style:normal;font-size:10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#262C36;color:var(--sub);display:inline-flex;align-items:center;justify-content:center}
.tabs button.on i{background:var(--acc);color:#111318}
.list{padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%}
.meta{font-size:13px;color:var(--mut);text-align:right}
.name{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700}
.type{font-size:14px;color:var(--sub)}
.loc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.fab{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0) 0%,var(--bg) 40%);display:flex;justify-content:center}
.big{width:100%;max-width:480px;height:56px;border:none;border-radius:18px;background:var(--acc);color:#111318;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.big.ghost{background:var(--btn);border:1px solid var(--btnline);color:var(--txt)}
.big.ok{background:rgba(61,214,140,.16);border:1px solid rgba(61,214,140,.5);color:var(--grn)}
.big:disabled{opacity:.5}
.big.rec{background:#FF6B5F;color:#111318;box-shadow:0 0 0 8px rgba(255,107,95,.18)}
.big[data-act="vocal"]{touch-action:none}
/* fiche */
.top{padding:20px 20px 0;display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px}
.sec{padding:16px 20px 0;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px 16px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;min-height:48px}
.line:last-child{border-bottom:none}
.line svg{flex:none;color:var(--mut)}
.notes{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;font-size:15px;line-height:1.5;color:#DDE2EA;white-space:pre-wrap}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:46px;border-radius:12px;font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{min-height:52px;border-radius:14px;background:var(--btn);border:1px solid var(--btnline);font-size:14px;font-weight:600;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2A313C;color:var(--txt);padding:12px 16px;border-radius:14px;font-size:14px;max-width:88%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:9;transition:opacity .3s}
.skel{height:130px;border-radius:22px;background:linear-gradient(90deg,#171B22 0%,#1d222b 50%,#171B22 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* notice */
.nchips{padding:12px 20px 0;display:flex;flex-wrap:wrap;gap:8px}
.nchips button{min-height:40px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.nfam{padding:22px 20px 0;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px}
.nfam .hd{display:flex;align-items:center;gap:12px}
.nfam .ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--card);border:1.5px solid var(--fc)}
.nfam .hd b{display:block;font-family:'Space Grotesk',sans-serif;font-size:21px}
.nfam .hd span{font-size:13px;color:var(--mut)}
.nrob{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.nrob .t{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;line-height:1.25}
.nrob .tech{font-size:12px;color:var(--mut);margin-top:2px}
.nwhen{align-self:flex-start;font-size:13px;font-weight:600;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent);padding:4px 10px;border-radius:9px}
.nsteps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.nsteps li{display:grid;grid-template-columns:24px 26px 1fr;gap:6px;align-items:start;font-size:14.5px;line-height:1.45;color:var(--sub)}
.nsteps .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fc);color:var(--fc);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.nsteps .e{font-size:18px;line-height:1.3}
.nfriends{margin:16px 20px 0;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px;font-size:14px;color:var(--sub)}
/* ROI prospects */
.jg{margin:16px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px}
.jg .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.jg .g{text-align:center}
.jg .g svg{width:100%;max-width:170px;display:block;margin:0 auto}
.jg .note{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.4}
.roi-bar{display:flex;align-items:center;gap:12px;width:calc(100% - 40px);margin:8px 20px 0;padding:12px 14px;border-radius:16px;border:1px solid var(--acc);background:rgba(245,197,24,.08);color:var(--txt);text-align:left}
.roi-bar.on{background:rgba(245,197,24,.18)}
.roi-bar svg{width:54px;flex:none}
.roi-bar .t{flex:1;min-width:0}
.roi-bar .k{font-size:11px;letter-spacing:.1em;color:var(--acc);font-weight:600}
.roi-bar b{font-family:'Space Grotesk',sans-serif;font-size:20px}
.roi-bar span{font-size:12px;color:var(--sub)}
.roi-bar .chev{font-size:22px;color:var(--acc)}
.roi-kpi2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.roi-kpi2 b{display:block;font-family:'Space Grotesk',sans-serif;font-size:20px}
.roi-kpi2 span{font-size:11px;color:var(--mut)}
.roi-pill{font-size:11px;padding:4px 9px;border-radius:8px;background:rgba(245,197,24,.12);color:var(--acc);border:1px solid var(--acc);white-space:nowrap}
.roi-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:center;margin-top:4px}
.roi-kpi{font-size:13px;line-height:1.9;color:var(--sub)}
.roi-kpi b{color:var(--txt);font-weight:600}
.roi-src{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.roi-src:last-of-type{border-bottom:none}
.roi-src b{font-weight:600}
.roi-src small{color:var(--mut);font-size:11px}
.roi-src .bar{height:6px;border-radius:3px;background:#2A313C;margin-top:5px;overflow:hidden}
.roi-src .bar i{display:block;height:100%;border-radius:3px}
.roi-stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:10px;background:#2A313C}
.roi-leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:12px;color:var(--sub);margin-top:8px}
.err{margin:30px 20px;padding:18px;border-radius:18px;background:rgba(255,107,95,.1);border:1px solid rgba(255,107,95,.4);color:#FFB3AC;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<div id="fab" class="fab"></div>
<script>
(function(){
var tg = window.Telegram && window.Telegram.WebApp;
var API = 'https://n8n.srv1029075.hstgr.cloud/webhook/fh-devis-api';
var S = { tab: 'devis', data: null, sel: null, busy: false, error: '' };
var PRIO = {
  U: { label: 'Urgent', c: '#FF6B5F', bg: 'rgba(255,107,95,.14)' },
  N: { label: 'Normal', c: '#FFA53D', bg: 'rgba(255,165,61,.14)' },
  P: { label: 'Pas pressé', c: '#3DD68C', bg: 'rgba(61,214,140,.14)' },
  '': { label: 'Sans urgence', c: '#9AA3B2', bg: '#1F242D' }
};
var IC = {
  pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  pin18: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  tel: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  cal: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  refresh: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  mic: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>'
};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function frDate(iso, opts){ if(!iso) return ''; var d = new Date(iso.length > 10 ? iso : iso + 'T12:00:00'); return d.toLocaleDateString('fr-FR', opts || { weekday:'short', day:'numeric', month:'short' }); }
function haptic(t){ try { tg && tg.HapticFeedback && (t === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light')); } catch(e){} }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 300); }, 2600); }
function confirmBox(msg, cb){ if (tg && tg.showConfirm && tg.initData) tg.showConfirm(msg, cb); else cb(window.confirm(msg)); }

function api(action, extra){
  var body = Object.assign({ action: action, initData: (tg && tg.initData) || '' }, extra || {});
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function(r){ return r.text().then(function(t){ var j; try { j = JSON.parse(t); } catch(e){ j = { ok:false, error: 'Réponse illisible du serveur (' + r.status + ')' }; } if (!r.ok && j.ok !== false) j = { ok:false, error: 'Erreur serveur ' + r.status }; return j; }); });
}
function load(silent){
  if (!silent){ S.data = null; S.error = ''; render(); }
  return api('data').then(function(j){
    if (!j.ok) { S.error = j.error || 'Accès refusé'; S.data = null; }
    else { S.data = j; S.error = ''; if (S.stats && !j.stats) j.stats = S.stats; if (S.sel){ S.sel = findItem(S.sel.kind, S.sel.item.id) ; } loadStats(); }
    render();
  }).catch(function(){ S.error = 'Pas de connexion au serveur n8n.'; render(); });
}
// ROI prospects : workflow n8n « Jauge devis (Mini App) » (cache recalculé toutes les 30 min : relevé Esabora + Notion)
var STATS_API = 'https://n8n.srv1029075.hstgr.cloud/webhook/fh-devis-stats';
function loadStats(){
  fetch(STATS_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: (tg && tg.initData) || '' }) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok && (j.roi || j.annees)) { S.stats = { annees: j.annees, maj: j.maj, roi: j.roi || null }; if (S.data) { S.data.stats = S.stats; if (!S.sel && !S.notice) { var sy = window.scrollY; render(); window.scrollTo(0, sy); } } } })
    .catch(function(){});
}
function findItem(kind, id){ var arr = (S.data && S.data[kind]) || []; for (var i=0;i<arr.length;i++) if (arr[i].id === id) return { kind: kind, item: arr[i] }; return null; }

function pill(u){ var p = PRIO[u || ''] || PRIO['']; return '<span class="pill" style="color:'+p.c+';background:'+p.bg+'"><span class="d" style="background:'+p.c+'"></span>'+p.label+'</span>'; }
function tagPill(txt, c, bg){ return '<span class="pill" style="color:'+c+';background:'+bg+'">'+esc(txt)+'</span>'; }

var TABS = [
  { id: 'devis', label: 'À faire', ic: '📝' },
  { id: 'visites', label: 'Visites', ic: '🏠' },
  { id: 'rappeler', label: 'Rappeler', ic: '📞' },
  { id: 'chantiers', label: 'Chantiers', ic: '🔨' },
  { id: 'depannages', label: 'Dépann.', ic: '🔧' }
];
var PHASE = {
  afaire: { label: 'À faire', c: '#4DA3FF', bg: 'rgba(77,163,255,.14)', sec: 'À FAIRE' },
  afacturer: { label: 'À facturer', c: '#FFA53D', bg: 'rgba(255,165,61,.14)', sec: 'FAITES · À FACTURER' },
  aencaisser: { label: 'À encaisser', c: '#F5C518', bg: 'rgba(245,197,24,.14)', sec: 'FACTURÉES · À ENCAISSER' }
};
function metaFor(kind, it){
  var t = S.data.today;
  if (kind === 'devis') { if (!it.pour) return 'Sans date'; return (it.pour < t ? '⚠ ' : '') + 'Pour ' + frDate(it.pour); }
  if (kind === 'visites') return it.rdv ? 'RDV ' + frDate(it.rdv, it.rdv.length > 10 ? { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' } : undefined) : 'RDV à fixer';
  if (kind === 'rappeler') return (it.motif === 'facture' ? 'Facturé il y a ' : 'Devis envoyé il y a ') + it.days + ' j';
  if (kind === 'relances') return 'Envoyé il y a ' + it.days + ' j';
  if (kind === 'chantiers') return it.depuis ? 'Accepté ' + frDate(it.depuis) : '';
  if (kind === 'depannages') {
    if (it.phase === 'afaire') return it.rdv ? frDate(it.rdv, it.rdv.length > 10 ? { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' } : undefined) : 'Date à fixer';
    if (it.phase === 'afacturer') return it.materiel ? 'Matériel dicté' : 'Matériel non dicté';
    return 'Facturé il y a ' + it.days + ' j' + (it.relPay ? ' · relance ' + it.relPay + '/3' : '');
  }
  return '';
}
function firstPill(kind, it){
  if (kind === 'visites') return it.etat === 'Visite programmée' ? tagPill('Programmée', '#4DA3FF', 'rgba(77,163,255,.14)') : tagPill(it.etat === 'Contact Entrant' ? 'Nouveau contact' : 'À programmer', '#C9CFD9', '#1F242D');
  if (kind === 'rappeler') return tagPill(it.motif === 'facture' ? 'Facture impayée' : 'Sans réponse', '#FF6B6B', 'rgba(255,107,107,.14)');
  if (kind === 'relances') return it.statut === 'En pause' ? tagPill('En pause', '#C9CFD9', '#1F242D') : pill(it.urgence);
  if (kind === 'chantiers') return tagPill('Accepté', '#3DD68C', 'rgba(61,214,140,.14)');

function nf(n){ return Math.round(n || 0).toLocaleString('fr-FR'); }
function eur(n){ n = n || 0; return n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace('.', ',') + ' M€' : n >= 1e4 ? nf(n / 1000) + ' k€' : nf(n) + ' €'; }
// ---- ROI prospects : € HT signés par prospect sur 90 jours, par source, raisons de perte (calculé par n8n) ----
// roi = { cur: { prospects, signes, perdus, ht, sources: { Appel: { prospects, signes, ht } }, raisons: { 'Trop cher': n } }, prev: {...}, premier }
var SRC_IC = { 'Appel': '📞', 'Site': '🌐', 'Mail': '✉️', 'Telegrafik': '🏥', 'Formulaire photos': '📸', 'Saisie Telegram': '🎙️', 'Bouche-à-oreille': '🗣️', 'Autre': '•', 'Non renseignée': '❔' };
var RAISON_C = { 'Trop cher': 'var(--red)', 'Délai trop long': 'var(--org)', 'Pas de nouvelles': 'var(--mut)', 'Autre artisan': 'var(--blu)', 'Autre raison': '#C9CFD9', 'Non renseignée': '#3A414D' };
function roiOk(r){ return !!(r && r.cur && r.cur.prospects); }
function roiArc(vp, sw){
  var max = Math.max(1000, Math.ceil(vp * 1.4 / 500) * 500);
  var v = Math.min(1, vp / max), t = Math.PI * (1 - v), ex = (80 + 62 * Math.cos(t)).toFixed(1), ey = (80 - 62 * Math.sin(t)).toFixed(1);
  var g = '<path d="M18 80 A62 62 0 0 1 142 80" fill="none" stroke="#2A313C" stroke-width="' + sw + '" stroke-linecap="round"/>';
  if (v > 0.01) g += '<path d="M18 80 A62 62 0 0 1 ' + ex + ' ' + ey + '" fill="none" stroke="var(--grn)" stroke-width="' + sw + '" stroke-linecap="round"/>';
  return g;
}
// Barre ROI pleine largeur sous les onglets : chiffre clé toujours visible, un appui ouvre / ferme le détail
function roiBar(r){
  if (!roiOk(r)) return '';
  var c = r.cur, vp = c.ht / c.prospects, on = S.tab === 'roi';
  return '<button class="roi-bar' + (on ? ' on' : '') + '" data-tab="roi" aria-label="ROI prospects : ' + esc(nf(vp)) + ' euros signés par prospect">'
    + '<svg viewBox="0 0 160 92" aria-hidden="true">' + roiArc(vp, 16) + '</svg>'
    + '<div class="t"><div class="k">ROI PROSPECTS · 90 J</div><div><b>' + esc(nf(vp)) + ' €</b> <span>signés / prospect · ' + nf(c.signes) + ' sur ' + nf(c.prospects) + '</span></div></div>'
    + '<span class="chev" aria-hidden="true">' + (on ? '⌄' : '›') + '</span></button>';
}
// Détail ROI : à la place de la liste quand la barre est ouverte
function roiDetail(r){
  if (!roiOk(r)) return '<div class="empty">Pas encore de prospect sur les 90 derniers jours.</div>';
  var c = r.cur, p = r.prev || {};
  var vp = c.ht / c.prospects, pp = p.prospects ? p.ht / p.prospects : null;
  var tend = '';
  if (pp != null) { var dlt = vp - pp; tend = '<span style="color:' + (dlt >= 0 ? 'var(--grn)' : 'var(--red)') + '">' + (dlt >= 0 ? '↑ +' : '↓ ') + esc(nf(dlt)) + ' € vs 90 j d\'avant</span>'; }
  else if (r.premier) tend = '<span style="color:var(--mut)">Suivi depuis le ' + esc(frDate(r.premier, { day: 'numeric', month: 'short' })) + '</span>';
  var h = '<div class="jg roi-kpi2"><div><b>' + esc(eur(c.ht)) + '</b><span>HT signés</span></div><div><b style="color:var(--grn)">' + Math.round(c.signes / c.prospects * 100) + ' %</b><span>prospects signés</span></div><div><b>' + nf(c.perdus) + '</b><span>perdus</span></div></div>';
  if (tend) h += '<div class="note" style="margin:8px 20px 0">' + tend + '</div>';
  var srcs = Object.keys(c.sources || {}).map(function(k){ var s = c.sources[k]; return { k: k, n: s.prospects, s: s.signes, v: s.prospects ? s.ht / s.prospects : 0 }; }).sort(function(a, b){ return b.v - a.v || b.n - a.n; });
  var top = srcs.length ? Math.max.apply(null, srcs.map(function(s){ return s.v; })) || 1 : 1;
  h += '<div class="jg"><div class="lbl">PAR SOURCE · € SIGNÉS / PROSPECT</div>';
  srcs.forEach(function(s){
    var w = Math.max(3, Math.round(s.v / top * 100)), col = s.v >= top * 0.6 ? 'var(--grn)' : 'var(--org)';
    h += '<div class="roi-src"><span>' + (SRC_IC[s.k] || '•') + '</span><div><b>' + esc(s.k) + '</b> <small>· ' + s.n + ' · ' + Math.round(s.s / s.n * 100) + ' %</small><div class="bar"><i style="width:' + w + '%;background:' + col + '"></i></div></div><b>' + esc(nf(s.v)) + ' €</b></div>';
  });
  if (c.sources && c.sources['Non renseignée']) h += '<div class="note">❔ = fiches sans source. Tu peux la compléter dans Notion (champ Source).</div>';
  h += '</div>';
  var rs = Object.keys(c.raisons || {}).map(function(k){ return { k: k, n: c.raisons[k] }; }).sort(function(a, b){ return b.n - a.n; });
  if (c.perdus) {
    h += '<div class="jg"><div class="lbl">POURQUOI PERDUS · ' + c.perdus + ' PROSPECT' + (c.perdus > 1 ? 'S' : '') + '</div><div class="roi-stack">';
    rs.forEach(function(x){ h += '<i style="width:' + (x.n / c.perdus * 100).toFixed(1) + '%;background:' + (RAISON_C[x.k] || '#3A414D') + '"></i>'; });
    h += '</div><div class="roi-leg">';
    rs.forEach(function(x){ h += '<span><b style="color:' + (RAISON_C[x.k] || '#3A414D') + '">●</b> ' + esc(x.k) + ' · ' + x.n + '</span>'; });
    h += '</div></div>';
  }
  return h;
}

function seg(items, cur, attr){
